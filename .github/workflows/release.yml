name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，如 0.05）"
        required: true
        type: string
      run_id:
        description: "要发布的 Build 运行 ID"
        required: true
        type: string
      commit:
        description: "要打标签的提交 SHA（留空用当前 HEAD）"
        required: false
        type: string
        default: ""
      notes:
        description: "发布说明（留空用仓库里的 release-notes.txt，两个都没有就用通用说明）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: termux-app-zh-arm64-v8a
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Rename APK
        run: |
          ls -l apk
          mv apk/termux-app_apt-android-7-debug_arm64-v8a.apk "termux-app-zh-v${{ inputs.version }}-arm64-v8a.apk"
          sha256sum "termux-app-zh-v${{ inputs.version }}-arm64-v8a.apk"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TARGET="${{ inputs.commit }}"
          if [ -z "$TARGET" ]; then TARGET="${{ github.sha }}"; fi
          TAG="v${{ inputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，先删掉它或换一个版本号再跑。"
            exit 1
          fi
          NOTES="${{ inputs.notes }}"
          if [ -z "$NOTES" ] && [ -f release-notes.txt ]; then NOTES="$(cat release-notes.txt)"; fi
          if [ -z "$NOTES" ]; then
            NOTES="Termux 中文版 $TAG，基于上游 v0.119.0-beta.3。安装说明：包名仍为 com.termux，安装前请先卸载官方 Termux；仅支持 arm64-v8a 设备；APK 为 debug 构建。"
          fi
          gh release create "$TAG" --target "$TARGET" --title "Termux 中文版 $TAG" --notes "$NOTES" --latest "termux-app-zh-v${{ inputs.version }}-arm64-v8a.apk"
