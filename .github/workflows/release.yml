name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v，如 0.01）"
        required: true
        type: string
      run_id:
        description: "要发布的 Build 运行 ID"
        required: true
        type: string
      commit:
        description: "要打标签的提交 SHA（留空用当前 HEAD）"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the built APK
        uses: actions/download-artifact@v4
        with:
          name: termux-app-zh-arm64-v8a
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Rename APK
        run: |
          ls -l apk
          mv apk/termux-app_apt-android-7-debug_arm64-v8a.apk "termux-app-zh-v${{ inputs.version }}-arm64-v8a.apk"
          sha256sum "termux-app-zh-v${{ inputs.version }}-arm64-v8a.apk"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET="${{ inputs.commit }}"
          if [ -z "$TARGET" ]; then TARGET="${{ github.sha }}"; fi
          gh release create "v${{ inputs.version }}" --target "$TARGET" --title "Termux 中文版 v${{ inputs.version }}" --notes "Termux 中文版 v${{ inputs.version }}，基于上游 v0.119.0-beta.3。\n\n本次更新：\n- 下载源修好：点预设立即切换，检测只在后台提示，不再弹框拦住；官方预设下镜像仓库也能选；新装默认官方源\n- 一键检测并推荐：点一下实测每个源的速度，软件源下真文件、镜像仓库下真镜像层，最快的标“推荐”，一点“使用推荐”同时换上\n- 更多源：预设加腾讯云、华为云（共 6 个加自定义）；镜像仓库加 1ms.run；dockerproxy 地址改成 .net\n- 测速文件自动删：测完就删，不留缓存\n\n包含内容：\n- 界面：完整简体中文；内置 Termux:Styling（114 套配色 + 8 款精选字体）\n- Linux 发行版：一键安装 Ubuntu / Debian / Arch / Alpine / Fedora / openSUSE / Void，可选版本，自动拉取最新版本和更新日期\n- AI 助手：Codex / Pi / Antigravity CLI / DeepSeek Harness / OpenCode / Aider / Claude Code，选择性安装，支持单独更新，抽屉快捷进入 + ai 命令\n- 网页版：dsh / OpenCode / Pi，手机浏览器打开\n- 提示符：24 套提示符主题 + 提示符颜色，自动同步到发行版\n- 下载源：一键检测并推荐（实测速度）；预设：官方 / 清华 / 中科大 / 阿里 / 腾讯 / 华为 / 自定义；镜像仓库：DaoCloud / dockerproxy / 1ms.run / Docker Hub；测速文件自动删\n- 模型配置：给每个助手配 API 地址、密钥和模型，可拉取模型列表、设主模型，支持自定义 API 路径；Codex 联网搜索开关；一键清除全部已应用\n- 抽屉：分区可折叠，会话区和 Linux/AI 分区之间可拖动分隔线，AI 助手有更新时显示角标（每小时检查，打开 Termux 也查）\n- 其他：主页干净（无欢迎文字，设置里可恢复），会话长按可删除\n\n安装说明：包名仍为 com.termux，安装前请先卸载官方 Termux；仅支持 arm64-v8a 设备；APK 为 debug 构建。" "termux-app-zh-v${{ inputs.version }}-arm64-v8a.apk"
