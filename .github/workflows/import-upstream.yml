name: Import upstream v0.119.0-beta.3
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-upstream.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import upstream tag and keep localization
        shell: bash
        run: |
          set -e
          git config user.name Bai
          git config user.email 46416178+bj1995112@users.noreply.github.com
          mkdir -p /tmp/keep/app/src/main/res /tmp/keep/termux-shared/src/main/res /tmp/keep/terminal-view/src/main/res
          cp -r app/src/main/res/values-zh-rCN /tmp/keep/app/src/main/res/ || true
          cp -r termux-shared/src/main/res/values-zh-rCN /tmp/keep/termux-shared/src/main/res/ || true
          cp -r terminal-view/src/main/res/values-zh-rCN /tmp/keep/terminal-view/src/main/res/ || true
          git clone --depth 1 --branch v0.119.0-beta.3 https://github.com/termux/termux-app.git /tmp/upstream
          git -C /tmp/upstream archive HEAD | tar -x -C .
          cp -r /tmp/keep/app/src/main/res/values-zh-rCN app/src/main/res/ || true
          cp -r /tmp/keep/termux-shared/src/main/res/values-zh-rCN termux-shared/src/main/res/ || true
          cp -r /tmp/keep/terminal-view/src/main/res/values-zh-rCN terminal-view/src/main/res/ || true
          rm -f TEST.txt
          rm -rf .github
          git add -A
          git commit -m 'Import Termux v0.119.0-beta.3 (e634d8f) with Simplified Chinese localization'
          git push origin main
